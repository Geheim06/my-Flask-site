<!DOCTYPE html>
<html lang="ru"
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0"
                <title>Контакты</title>
      </head>
<style>
    *  {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial,sans-serif;
        background:#f2f4f7;
        color:#222;
    }
    .contacts-container  {
        width: 90;
        max-width: 900px;
        margin: 50px auto;
    }
    .contacts-container h1 {
        text-align: center;
        margin-botton: 30px;
        font-size: 36px;
    }
    .contact-card  {
        background:white;
        pading: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0.0.0,0.08);
        transition: 0.2s;
    }
    .contact-list  {
        display: grid;
        grid-template-columns: repaet( auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }
    .contact-card h2  {
        margin-botton: 10px;
        font-size:22px;
    }
    .contact-card p  {
        margin: 7px 0;
        color: #666;
    }
    .contact-card:hover  {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0.0.0.0.12);
    }
    .contact-card a  {
        color:#3478f6;
        text-decoration: none;
    }
    .contact-card a:hover  {
        text-decoraton: underline;
    }
    .contact-button  {
        margin-top: 15px;
        padding: 10px 18px;
        color: white;
        border-radius: 8px;
        background: #3478f6;
        text-decoration: none;
        transition: 0.2s;
        display: inline-block;
    }
    .contact-button:hover  {
        background: #2463d4;
    }
    </style>
<body>
<section>
<div class="contacts-container">
    <h2>Контакты:</h2>
</div>
</section>
<section>
    <div class="contact-card">
<p>Свяжитесь со мной удобным для вас способом:</p>
<ul>
    <li>Телефон: +7 (900) 123-45-67</li>
    <li>@Email: example@mail.com</li>
    <li>Адрес:Deutschland, Wismar</li>

</ul>
<h2>Форма обратной связи</h2>
<form action="/contact" method="POST">

    <label for="name">Ваше имя:</label>
    <input type="text" id="name" name="name"><br><br>

    <label for="message">Сообщение:</label> <br>
    </div>
</section>

<section>
    <div class="contact-button">
    <button type="submit">Отправить</button>
</form>
    </div>
</section>

 <h2>{{message}}</h2>
<div class="contact-card a">
    <div class="contact-card a:hover">
<a href="/">Вернустья на главную</a>
    </div>
</div>
</body>
</html>
